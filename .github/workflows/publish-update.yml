name: Publish signed clock update

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'release-payload/**'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clock-update-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'baqha0717-netizen/Talking-clock.' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check distribution payload is complete
        id: payload
        shell: bash
        run: |
          if test -f release-payload/index.json; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Reassemble and verify exact signed distribution files
        if: steps.payload.outputs.ready == 'true'
        run: python3 scripts/assemble_release.py
      - name: Verify APK package, version, SDK and cryptographic signature
        if: steps.payload.outputs.ready == 'true'
        run: python3 scripts/validate_ci.py
      - name: Publish complete verified release
        if: steps.payload.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_release.py
